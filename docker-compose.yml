services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: team_task_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_task_board"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
