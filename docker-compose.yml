services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: team_task_board
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d team_task_board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
