openapi: 3.1.0
info:
  title: Team Task Board API
  version: 1.0.0
  description: >
    All `/api/v1` endpoints except register, login, logout, and health require a session:
    the `session` cookie set by login, or `Authorization: Bearer <token>`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: session }
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    Project:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR] }
            message: { type: string }
  responses:
    ValidationError:
      description: Invalid or missing body fields (code `VALIDATION_ERROR`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No valid session (code `UNAUTHENTICATED`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ProjectNotFound:
      description: No project with this id owned by the caller (code `NOT_FOUND`). Another user's project also returns 404.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InternalError:
      description: Unexpected server error, for example the database is unavailable (code `INTERNAL_ERROR`, generic message).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: Does not log the user in; the UI redirects to the login page.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, description: Trimmed and lowercased }
                name: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email already registered (code `EMAIL_TAKEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: Sets the `session` cookie (httpOnly, Secure, SameSite=Lax, 7 days) and returns the same JWT for Bearer clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie: { schema: { type: string }, description: "session=<jwt>; HttpOnly; Secure; SameSite=Lax; Path=/" }
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string, description: JWT (HS256) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Wrong email or password (code `INVALID_CREDENTIALS`, same message for both).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Clears the `session` cookie. Bearer tokens stay valid until they expire.
      security: []
      responses:
        "204": { description: Session cookie cleared. }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /projects:
    get:
      operationId: listProjects
      summary: List your projects
      description: Only the caller's projects, newest first.
      responses:
        "200":
          description: The caller's projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createProject
      summary: Create a project
      description: The caller becomes the owner; any `ownerId` in the body is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, description: Trimmed before validation }
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/Project" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get one of your projects
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/Project" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProject
      summary: Delete one of your projects
      description: Also deletes all of the project's tasks.
      responses:
        "204": { description: Project and its tasks deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public. Confirms the app is running and can reach the database; used to verify deployments.
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema: { type: object, required: [status, database], properties: { status: { const: ok }, database: { const: ok } } }
        "503":
          description: The database is unreachable; details are logged server-side only.
          content:
            application/json:
              schema: { type: object, required: [status, database], properties: { status: { const: error }, database: { const: unreachable } } }
