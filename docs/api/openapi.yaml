openapi: 3.1.0
info:
  title: Team Task Board API
  version: 1.0.0
  description: >
    All `/api/v1` endpoints except register, login, logout, and health require a session:
    the `session` cookie set by login, or `Authorization: Bearer <token>`.
    Interactive docs: `/api/docs`; this file is served at `/api/docs/openapi.yaml`.
    Access is by project membership: the OWNER and MEMBERs of a project can read it and work on its tasks;
    only the OWNER can delete it or manage members (403 for a MEMBER). A project, task, or member the caller
    cannot reach returns 404, never 403, so ids reveal nothing to nonmembers.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: session }
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    ProjectRole:
      type: string
      enum: [OWNER, MEMBER]
    Project:
      type: object
      required: [id, name, createdAt, role]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        role: { $ref: "#/components/schemas/ProjectRole", description: The caller's role in the project }
    ProjectMember:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/ProjectRole" }
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    Task:
      type: object
      required: [id, projectId, title, status, priority]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, description: Omitted when the task has no description }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        assignee:
          type: object
          description: Omitted when the task is unassigned
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
    Comment:
      type: object
      required: [id, taskId, body, createdAt, author]
      properties:
        id: { type: string }
        taskId: { type: string }
        body: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        author:
          type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/Task" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR] }
            message: { type: string }
  responses:
    ValidationError:
      description: Invalid or missing body fields (code `VALIDATION_ERROR`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No valid session (code `UNAUTHENTICATED`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ProjectNotFound:
      description: No project with this id that the caller is a member of (code `NOT_FOUND`). A project the caller does not belong to also returns 404.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TaskNotFound:
      description: No task with this id in a project the caller is a member of (code `NOT_FOUND`). Tasks in other projects also return 404.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    OwnerOnly:
      description: The caller is a MEMBER, and only the project OWNER may do this (code `FORBIDDEN`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InternalError:
      description: Unexpected server error, for example the database is unavailable (code `INTERNAL_ERROR`, generic message).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: Does not log the user in; the UI redirects to the login page.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, description: Trimmed and lowercased }
                name: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email already registered (code `EMAIL_TAKEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: Sets the `session` cookie (httpOnly, Secure, SameSite=Lax, 7 days) and returns the same JWT for Bearer clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie: { schema: { type: string }, description: "session=<jwt>; HttpOnly; Secure; SameSite=Lax; Path=/" }
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string, description: JWT (HS256) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Wrong email or password (code `INVALID_CREDENTIALS`, same message for both).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Clears the `session` cookie. Bearer tokens stay valid until they expire.
      security: []
      responses:
        "204": { description: Session cookie cleared. }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /projects:
    get:
      operationId: listProjects
      summary: List the projects you are a member of, with your role
      description: Only the caller's projects, newest first.
      responses:
        "200":
          description: The caller's projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createProject
      summary: Create a project (you become its OWNER)
      description: The caller becomes the owner; any `ownerId` in the body is ignored. A valid token whose user was deleted gets 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, description: Trimmed before validation }
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/Project" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get a project you are a member of, with your role
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { type: object, required: [project], properties: { project: { $ref: "#/components/schemas/Project" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProject
      summary: Delete a project you own
      description: OWNER only. Also deletes all of the project's tasks and memberships.
      responses:
        "204": { description: Project, its tasks, and its memberships deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMembers
      summary: List the project's members, owner first
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: addMember
      summary: Add an existing user to the project by email
      description: OWNER only. The email is trimmed and lowercased; the user must already have an account. No email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: Member added with the MEMBER role.
          content:
            application/json:
              schema: { type: object, required: [member], properties: { member: { $ref: "#/components/schemas/ProjectMember" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404":
          description: The caller is not a member (`Project not found`), or no account uses this email (`No account uses this email`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The user is already a member (code `CONFLICT`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/InternalError" }
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave the project
      description: The OWNER can remove any MEMBER; a MEMBER can remove only themselves (leave). Access is revoked on the next request.
      responses:
        "204": { description: Membership removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404":
          description: The caller is not a member (`Project not found`), or the user is not a member (`Member not found`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The OWNER cannot be removed (code `CONFLICT`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/InternalError" }
  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTasks
      summary: List a project's tasks
      description: All tasks of one of your projects, oldest first.
      responses:
        "200":
          description: The project's tasks.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createTask
      summary: Create a task
      description: New tasks always start in `TODO`; a `status` in the body is ignored. `priority` defaults to `MEDIUM`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120, description: Trimmed before validation }
                description:
                  type: [string, "null"]
                  maxLength: 2000
                  description: Optional; trimmed, and blank or null means no description
                priority:
                  $ref: "#/components/schemas/TaskPriority"
                  description: Optional; defaults to MEDIUM
                assigneeId:
                  type: [string, "null"]
                  minLength: 1
                  description: Optional user id of a current project member; null or omitted leaves the task unassigned (400 if not a member)
      responses:
        "201":
          description: Task created.
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskResponse" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      operationId: updateTask
      summary: Update a task
      description: Change the title, description, status, priority, or assignee. Send at least one field; omitted fields stay unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 120, description: Trimmed before validation }
                description:
                  type: [string, "null"]
                  maxLength: 2000
                  description: Blank or null removes the description
                status: { $ref: "#/components/schemas/TaskStatus" }
                priority: { $ref: "#/components/schemas/TaskPriority" }
                assigneeId:
                  type: [string, "null"]
                  minLength: 1
                  description: User id of a current project member, or null to unassign (400 if not a member)
      responses:
        "200":
          description: The updated task.
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskResponse" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteTask
      summary: Delete a task
      responses:
        "204": { description: Task deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tasks/{taskId}/comments:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listComments
      summary: List a task's comments, oldest first
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: addComment
      summary: Comment on a task
      description: Any project member. The body is trimmed and must be 1–1000 characters. Access is checked before validation, so a nonmember always gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Comment created; the caller is the author.
          content:
            application/json:
              schema: { type: object, required: [comment], properties: { comment: { $ref: "#/components/schemas/Comment" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: The author may delete their own comment; the project OWNER may delete any comment in the project.
      responses:
        "204": { description: Comment deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The caller is a member but neither the author nor the OWNER (code `FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such comment in a project the caller belongs to (code `NOT_FOUND`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/InternalError" }
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public. Confirms the app is running and can reach the database; used to verify deployments.
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema: { type: object, required: [status, database], properties: { status: { const: ok }, database: { const: ok } } }
        "503":
          description: The database is unreachable; details are logged server-side only.
          content:
            application/json:
              schema: { type: object, required: [status, database], properties: { status: { const: error }, database: { const: unreachable } } }
